<!doctype html>
<!--
  Source for public/og-image.png (1200×630). Render with: npm run og
  Uses the site's own font, colours and off-register drawing.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og-image</title>
    <style>
      @font-face {
        font-family: "Schibsted Grotesk";
        font-weight: 400 900;
        src: url("../node_modules/@fontsource-variable/schibsted-grotesk/files/schibsted-grotesk-latin-wght-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Schibsted Grotesk";
        font-style: italic;
        font-weight: 400 900;
        src: url("../node_modules/@fontsource-variable/schibsted-grotesk/files/schibsted-grotesk-latin-wght-italic.woff2") format("woff2");
      }
      :root {
        --paper: #ecebe3;
        --ink: #191919;
        --cyan: #00a3e0;
        --magenta: #e5007d;
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: var(--paper);
        color: var(--ink);
        font-family: "Schibsted Grotesk", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .overprint { position: absolute; mix-blend-mode: multiply; }
      .circle { right: -110px; top: -150px; width: 560px; height: 560px; border-radius: 50%; background: var(--cyan); }
      .bar { right: -40px; top: 418px; width: 360px; height: 96px; background: var(--magenta); transform: rotate(-6deg); }
      .label {
        position: absolute;
        font-size: 17px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
      }
      .top { left: 56px; top: 46px; }
      .site { left: 56px; bottom: 44px; }
      .roles { right: 56px; bottom: 44px; text-align: right; }
      .rule { position: absolute; left: 0; right: 0; bottom: 96px; border-top: 3px solid var(--ink); }
      h1 {
        position: absolute; left: 50px; top: 104px;
        font-size: 104px; font-weight: 900; line-height: 0.84; letter-spacing: -0.055em;
      }
      h1 span { display: block; }
      h1 .i { font-weight: 400; font-style: italic; }
      #drawing { position: absolute; right: 40px; bottom: 98px; width: 470px; }
    </style>
  </head>
  <body>
    <span class="overprint circle"></span>
    <span class="overprint bar"></span>

    <p class="label top">Mardino Santosa · Makassar</p>

    <h1>
      <span>Networks</span>
      <span class="i" style="padding-left: 0.6em">that stay up.</span>
      <span style="padding-left: 1.6em">Apps</span>
      <span class="i" style="padding-left: 2.2em">that ship.</span>
    </h1>

    <canvas id="drawing"></canvas>

    <div class="rule"></div>
    <p class="label site">zdienos.com</p>
    <p class="label roles">Sysadmin · Full-stack developer</p>

    <script>
      // Same off-register print as src/components/Misregister.jsx
      const PLATES = [
        ["--cyan", -3, -2],
        ["--magenta", 3, 2],
        ["--ink", 0, 0],
      ];
      const img = new Image();
      img.onload = () => {
        const canvas = document.getElementById("drawing");
        const w = canvas.clientWidth * 2;
        const h = Math.round((w * img.naturalHeight) / img.naturalWidth);
        canvas.width = w;
        canvas.height = h;
        canvas.style.height = h / 2 + "px";

        const mask = document.createElement("canvas");
        mask.width = w;
        mask.height = h;
        const mctx = mask.getContext("2d");
        mctx.drawImage(img, 0, 0, w, h);
        const data = mctx.getImageData(0, 0, w, h);
        const px = data.data;
        for (let i = 0; i < px.length; i += 4) {
          const lum = (0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]) / 255;
          px[i] = px[i + 1] = px[i + 2] = 0;
          px[i + 3] = Math.round(Math.min(1, Math.max(0, (0.8 - lum) * 2.4)) * 255);
        }
        mctx.putImageData(data, 0, 0);

        const plate = document.createElement("canvas");
        plate.width = w;
        plate.height = h;
        const pctx = plate.getContext("2d");
        const ctx = canvas.getContext("2d");
        ctx.globalCompositeOperation = "multiply";
        const css = getComputedStyle(document.documentElement);
        for (const [color, dx, dy] of PLATES) {
          pctx.globalCompositeOperation = "source-over";
          pctx.clearRect(0, 0, w, h);
          pctx.drawImage(mask, 0, 0);
          pctx.globalCompositeOperation = "source-in";
          pctx.fillStyle = css.getPropertyValue(color).trim();
          pctx.fillRect(0, 0, w, h);
          ctx.drawImage(plate, dx * 2, dy * 2);
        }
        document.fonts.ready.then(() => (document.body.dataset.ready = "1"));
      };
      img.src = "../src/Assets/portrait-drawing.jpg";
    </script>
  </body>
</html>
