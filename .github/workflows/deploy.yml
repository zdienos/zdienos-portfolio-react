name: Deploy to zdienos.com

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would change on the server"
        type: boolean
        default: false

# Never run two uploads at the same time
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A real upload happens only when FTP_DEPLOY_LIVE is "true" and the
      # manual "dry run" box is not ticked
      LIVE: ${{ vars.FTP_DEPLOY_LIVE == 'true' && inputs.dry_run != true }}
      # Optional: purge Cloudflare after a live deploy when these are set
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && (vars.CLOUDFLARE_ZONE_ID != '' || secrets.CLOUDFLARE_ZONE_ID != '') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check deploy settings
        id: settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          missing=""
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing deploy settings:$missing (see README, Deploy)"
            exit 1
          fi
          dir="${FTP_SERVER_DIR%/}/"
          # Guard against uploading next to public_html instead of into it
          case "$dir" in
            / | */public_html/ | public_html/) echo "Target folder: $dir" ;;
            *) echo "::error::FTP_SERVER_DIR should be the public_html folder, e.g. domains/zdienos.com/public_html/ (or / for an FTP account limited to it)"; exit 1 ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # Log in once and look at the target folder before touching anything:
      # it must exist and already hold the site's index.html.
      - name: Check target folder on the server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DIR: ${{ steps.settings.outputs.dir }}
        run: |
          umask 077
          printf 'machine %s login %s password %s\n' "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" > "$RUNNER_TEMP/netrc"
          # An absolute path needs %2F in an FTP URL; otherwise it is relative to the login folder
          case "$DIR" in /*) path="%2F${DIR#/}" ;; *) path="$DIR" ;; esac
          # --insecure matches the upload step's default (shared hosts often serve a
          # certificate for the server name, not the domain); traffic is still TLS
          list() {
            curl -sS --ssl-reqd --insecure --connect-timeout 30 --list-only \
              --netrc-file "$RUNNER_TEMP/netrc" "ftp://$FTP_SERVER/$1"
          }
          if ! listing=$(list "$path"); then
            # Show where this FTP account lands after login, to find the right path
            echo "Folder this FTP account sees right after login:"
            list "" | sort | head -50 || true
            rm -f "$RUNNER_TEMP/netrc"
            echo "::error::Could not open $DIR over FTPS. Set FTP_SERVER_DIR relative to the folder listed above."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/netrc"
          echo "Contents of $DIR:"
          echo "$listing" | sort | head -50
          if ! echo "$listing" | grep -qx 'index.html'; then
            echo "::error::$DIR has no index.html; is this really the site folder?"
            exit 1
          fi

      # Until the FTP_DEPLOY_LIVE variable is "true", every run is a dry run:
      # the log shows what would be uploaded, and the server is left alone.
      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ steps.settings.outputs.dir }}
          dry-run: ${{ env.LIVE != 'true' }}
          log-level: standard

      # Cloudflare caches static files (.js, .png, .pdf) at the edge; clear it so
      # non-hashed files such as cv-en.pdf and the service workers update at once
      - name: Purge Cloudflare cache
        if: env.LIVE == 'true' && env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          if echo "$response" | grep -q '"success":true'; then
            echo "Cloudflare cache purged"
          else
            echo "::warning::Cloudflare purge failed: $response"
          fi
